<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<title>Login | Faculty Directory</title>
</head>
<body>
<main class="auth-page">
  <section class="auth-card">
    <div class="text-center mb-4">
      <div class="display-5 text-primary"><i class="bi bi-mortarboard-fill"></i></div>
      <h1 class="h2 fw-bold mt-2">Faculty Directory</h1>
      <p class="text-muted mb-0">Faculty Directory System | ระบบค้นหารายชื่ออาจารย์</p>
    </div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="studentId" class="form-label fw-semibold">Student ID | รหัสนักศึกษา</label>
        <input id="studentId" class="form-control form-control-lg" inputmode="numeric" autocomplete="username" required>
      </div>

      <div class="mb-2">
        <label for="password" class="form-label fw-semibold">Password | รหัสผ่าน</label>
        <div class="input-group input-group-lg">
          <input id="password" type="password" class="form-control" autocomplete="current-password" required>
          <button id="togglePassword" class="btn btn-outline-secondary" type="button" aria-label="Show password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="text-end mb-4">
        <a href="#" onclick="alert('Please contact university administrator. | กรุณาติดต่อผู้ดูแลระบบมหาวิทยาลัย'); return false;">
          Forgot Password? | ลืมรหัสผ่าน?
        </a>
      </div>

      <button id="loginButton" class="btn btn-primary btn-lg w-100 fw-semibold" type="submit">
        <i class="bi bi-box-arrow-in-right me-2"></i>
        Login | เข้าสู่ระบบ
      </button>

      <p class="small text-muted text-center mt-4 mb-0">
        After 3 failed attempts, the account is locked for 10 minutes.
        | หากกรอกรหัสผิดครบ 3 ครั้ง ระบบจะล็อกบัญชี 10 นาที
      </p>
    </form>

    <div id="loginMessage" class="mt-3"></div>
    <div id="lockCountdown" class="mt-3 d-none"></div>

    <div class="alert alert-info small mt-4 mb-0">
      Demo: Student ID <strong>672431002</strong>, Password <strong>672431002</strong>
    </div>
  </section>
</main>

<script src="js/data.js"></script>
<script src="js/theme.js"></script>
<script src="js/login.js"></script>
</body>
</html>
